# Nginx config pro LocaTech em VM única.
#
# - HTTP redireciona pra HTTPS
# - HTTPS via Let's Encrypt (cert montado em /etc/letsencrypt)
# - Proxy pra container `app` na porta 3000
# - Public files diretos do nginx (mais rápido que passar pelo Next)

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  # Logs
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent"';
  access_log /var/log/nginx/access.log main;
  error_log /var/log/nginx/error.log warn;

  # Compressão
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
  gzip_min_length 1000;

  # Rate limit básico (refina conforme tráfego)
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

  # ===== Servidor HTTPS =====
  # Descomentar depois de rodar certbot:
  #
  # server {
  #   listen 443 ssl http2;
  #   server_name locatech.com.br www.locatech.com.br;
  #
  #   ssl_certificate /etc/letsencrypt/live/locatech.com.br/fullchain.pem;
  #   ssl_certificate_key /etc/letsencrypt/live/locatech.com.br/privkey.pem;
  #   ssl_protocols TLSv1.2 TLSv1.3;
  #   ssl_ciphers HIGH:!aNULL:!MD5;
  #
  #   client_max_body_size 20M;
  #
  #   # Headers de segurança (também tem do Next.config mas reforço aqui)
  #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  #   add_header X-Frame-Options DENY always;
  #
  #   location / {
  #     limit_req zone=api burst=20 nodelay;
  #     proxy_pass http://app:3000;
  #     proxy_http_version 1.1;
  #     proxy_set_header Upgrade $http_upgrade;
  #     proxy_set_header Connection "upgrade";
  #     proxy_set_header Host $host;
  #     proxy_set_header X-Real-IP $remote_addr;
  #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #     proxy_set_header X-Forwarded-Proto $scheme;
  #     proxy_cache_bypass $http_upgrade;
  #   }
  # }

  # ===== Servidor HTTP (redirect + ACME) =====
  server {
    listen 80 default_server;
    server_name _;

    # Webroot pro certbot
    location /.well-known/acme-challenge/ {
      root /var/www/public;
    }

    # Antes de ativar HTTPS, comente o block abaixo e descomente o proxy_pass:
    location / {
      # return 301 https://$host$request_uri;
      proxy_pass http://app:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
